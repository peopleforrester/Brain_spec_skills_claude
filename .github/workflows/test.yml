# ABOUTME: GitHub Actions workflow that runs the bash test suite on push/PR.
# ABOUTME: Tests are pure bash; no toolchain setup beyond the Ubuntu default shell.

name: tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  bash-tests:
    name: Run tests/run-tests.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run test suite
        shell: bash
        run: bash tests/run-tests.sh

      - name: Verify checksums
        shell: bash
        run: sha256sum -c checksums.txt

      - name: Lint shell scripts with shellcheck
        shell: bash
        # Test files reference helper functions injected by run-tests.sh at
        # runtime (assert_contains, etc.); shellcheck cannot resolve those, so
        # we lint the runner and the installer — the two standalone scripts.
        # --severity=warning silences SC2317 ("unreachable") false positives
        # in run-tests.sh, where assert_* functions are called from sourced
        # subshells that shellcheck cannot trace.
        run: shellcheck --severity=warning install.sh tests/run-tests.sh
